[project]
name = "crop-advisor"
version = "1.0.0"
description = "Sowing recommendations and crop rotation strategies from NASA climate data"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "imagecodecs>=2024.1.1",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyproj>=3.6",
    "rasterio>=1.5.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "tifffile>=2024.1.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../..", "../regressions"]

[tool.ruff]
line-length = 120
