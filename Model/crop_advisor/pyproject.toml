[project]
name = "crop-advisor"
version = "1.0.0"
description = "Sowing recommendations and crop rotation strategies from NASA climate data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
